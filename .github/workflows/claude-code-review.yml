name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    # Fork-guard: only auto-review PRs from branches within this repo.
    # PRs opened from outside forks are skipped so untrusted code never
    # runs on the self-hosted runner. Team PRs (same-repo branches) run normally.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # Isolate CI from the runner operator's personal Claude config.
      # The action resolves config from $HOME/.claude, so we point HOME at a
      # per-job temp dir: every PR gets a clean, reproducible review and no
      # one's ~/.claude is read or mutated. $RUNNER_TEMP avoids a hardcoded
      # path; it is exported via $GITHUB_ENV because the runner context is not
      # available in a job-level env block. HOME then applies to all later steps.
      - name: Isolate Claude config
        run: |
          mkdir -p "$RUNNER_TEMP/claude-home"
          echo "HOME=$RUNNER_TEMP/claude-home" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
