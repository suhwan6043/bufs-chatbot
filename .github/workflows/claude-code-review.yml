name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    # Fork-guard: only auto-review PRs from branches within this repo.
    # PRs opened from outside forks are skipped so untrusted code never
    # runs on the self-hosted runner. Team PRs (same-repo branches) run normally.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    # Isolate CI from the runner operator's personal Claude config.
    # The action resolves config from $HOME/.claude, so pointing HOME at a
    # per-job temp dir gives every PR a clean, identical, reproducible review
    # (stock code-review plugin only) and never reads or mutates a person's
    # ~/.claude. runner.temp is used so there is no hardcoded machine path.
    env:
      HOME: ${{ runner.temp }}/claude-home
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Prepare isolated Claude home
        run: mkdir -p "$HOME"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
